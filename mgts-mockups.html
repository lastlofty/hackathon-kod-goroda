* { box-sizing:border-box; }
body { margin:0; background:var(--background,#eff0f1); color:var(--foreground,#202328); font:13px/1.45 Golos,"Segoe UI",sans-serif; }
button,input { font:inherit; }
button { cursor:pointer; }
button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid #2b67ba; outline-offset:2px; }
[hidden] { display:none !important; }
h1,h2,h3,p,figure,dl,dd { margin:0; }
img { display:block; max-width:100%; }
.layout { max-width:1600px; padding:10px; margin:auto; }
.workspace { --ink:#262b30; --muted:#5b636a; --quiet:#f2f3f3; --paper:#fff; --line:#d9ddde; --accent:#a33b29; --selected:#f3f0ed; background:var(--paper); color:var(--ink); border:1px solid #c8ced0; }
.cover { display:flex; min-height:49px; align-items:stretch; justify-content:space-between; column-gap:22px; color:#fff; background:#252a2d; padding:0 15px; border-bottom:1px solid #171a1d; }
.brand { display:flex; align-items:center; gap:11px; white-space:nowrap; }
.brand b { padding-left:9px; border-left:3px solid #de7051; font-size:17px; line-height:19px; letter-spacing:-.015em; }
.brand span { color:#d8dcdf; font-size:11px; }
.options { display:flex; align-items:stretch; flex:1; }
.options button { padding:0 13px; border:0; border-bottom:2px solid transparent; background:transparent; color:#d3d7da; white-space:nowrap; font-size:12px; }
.options button[aria-pressed=true] { color:white; background:#343a3e; border-bottom-color:#e17b5e; }
.options button:hover { background:#343a3e; }
.top-action { align-self:center; }
.button { color:var(--ink); background:var(--paper); border:1px solid #bfc5c7; border-radius:2px; min-height:30px; padding:4px 9px; font-size:12px; font-weight:500; white-space:nowrap; }
.button:hover { background:#f2f3f3; border-color:#939b9e; }
.button.primary { background:#343b3f; border-color:#343b3f; color:white; }
.button.primary:hover { background:#455054; }
.cover .button { background:transparent; border-color:#717a80; color:white; }
.cover .button:hover { background:#455054; }
.button.mini { min-height:26px; padding:3px 8px; }
.button.text { background:none; border:0; color:#2c515d; padding-inline:0; min-height:24px; text-decoration:underline; text-underline-offset:3px; }
.button.text:hover { color:#172e36; }
.chrome { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 15px; border-bottom:1px solid var(--line); background:#fafafa; }
.chrome h1 { color:var(--ink); font-size:22px; font-weight:600; letter-spacing:-.032em; line-height:1.2; }
.chrome .muted { margin-top:3px; }
.muted { color:var(--muted); font-size:11px; }
.mono { font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; font-variant-numeric:tabular-nums; }
.action-group { display:flex; align-items:center; gap:7px; }
h2 { font-size:13px; font-weight:600; line-height:1.3; }
h3 { font-size:13px; font-weight:600; }
.section-head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
.selector { display:flex; gap:3px; align-items:center; flex-wrap:wrap; }
.selector button { padding:4px 6px; border:1px solid transparent; border-radius:2px; color:var(--muted); background:none; font-size:11px; white-space:nowrap; }
.selector button:hover { background:var(--quiet); }
.selector button[aria-pressed=true] { color:var(--ink); border-color:#c7cdcf; background:var(--paper); }
.dispatch .split { display:grid; grid-template-columns:minmax(236px,27%) minmax(0,1fr); }
.queue { background:var(--paper); border-right:1px solid var(--line); }
.queue .selector { padding:6px 9px; background:#f5f6f6; border-bottom:1px solid var(--line); }
.queue-row,.detection-row { color:var(--ink); background:transparent; text-align:left; display:grid; grid-template-columns:minmax(0,1fr) auto; width:100%; align-items:start; gap:5px 10px; padding:9px 10px; border:0; border-left:3px solid transparent; border-bottom:1px solid #e6e9e9; }
.queue-row:hover,.detection-row:hover { background:#f6f7f7; }
.queue-row[aria-pressed=true],.detection-row[aria-pressed=true] { border-left-color:var(--accent); background:#f1eeeb; }
.row-name,.row-meta { display:block; overflow-wrap:anywhere; }
.row-name { font-size:12px; font-weight:600; line-height:1.26; }
.row-meta { color:var(--muted); font-size:11px; margin-top:3px; }
.row-code { color:var(--muted); text-align:right; margin-top:2px; white-space:nowrap; }
.critical { --tone:#9d3928; --dot:#a9402d; }
.review { --tone:#775822; --dot:#9b762f; }
.normal { --tone:#3f5b55; --dot:#617973; }
.severity { color:var(--tone); display:inline-flex; gap:5px; align-items:center; font-size:11px; font-weight:550; }
.severity::before { content:""; background:var(--dot); width:6px; height:6px; border-radius:50%; flex:0 0 6px; }
.map { position:relative; min-height:506px; overflow:hidden; isolation:isolate; background:#e2e5df; }
.map-image { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
.map-label,.map-credit { position:absolute; z-index:2; background:#ffffffec; color:#2e373a; border:1px solid #cbd0cf; }
.map-label { top:9px; left:9px; padding:4px 7px; font-size:11px; }
.map-credit { bottom:5px; left:5px; padding:2px 4px; font-size:9px; }
.map-credit a { color:inherit; }
.marker { position:absolute; z-index:3; left:var(--x); top:var(--y); transform:translate(-50%,-50%); width:23px; height:23px; display:grid; place-content:center; padding:0; color:white; background:var(--dot); font-size:11px; font-weight:600; border:2px solid white; border-radius:50%; box-shadow:0 1px 2px #343a3d66; }
.marker:hover,.marker[aria-pressed=true] { z-index:4; box-shadow:0 0 0 2px #242a2c,0 1px 3px #343a3d88; }
.map-tooltip { position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-158%); color:#fff; background:#303539; z-index:2; padding:3px 6px; font-size:10px; white-space:nowrap; pointer-events:none; }
.map-drawer { position:absolute; z-index:5; right:10px; bottom:10px; width:min(275px,50%); background:var(--paper); border:1px solid #bfc6c5; box-shadow:0 2px 8px #383f402e; }
.map-drawer .section-head { padding:7px 9px; align-items:flex-start; }
.map-drawer .section-head h2 { margin:1px 0 2px; }
.map-drawer .content { padding:7px 9px; }
.map-drawer .photo { margin:0 0 5px; }
.drawer-control { display:flex; align-items:center; justify-content:space-between; gap:5px; margin-top:2px; }
.photo { position:relative; overflow:hidden; background:#25292c; aspect-ratio:1.5; isolation:isolate; }
.photo img { width:100%; height:100%; object-fit:fill; }
.bbox { position:absolute; border:2px solid var(--box); left:var(--box-x); top:var(--box-y); width:var(--box-w); height:var(--box-h); color:#1f2323; box-shadow:0 0 0 1px #1e1d1c68; }
.box-label { position:absolute; bottom:100%; left:-2px; background:var(--box); padding:1px 4px; font:10px/1.5 Golos,sans-serif; white-space:nowrap; }
.bbox.top-edge .box-label { top:100%; bottom:auto; }
.box-label.align-right { left:auto; right:-2px; }
dl div { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:2px 7px; border-bottom:1px solid #e6e9e9; padding:4px 0; font-size:11px; }
dt { color:var(--muted); }
dd { font-weight:500; }
.viewer .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(233px,28%); }
.frame-workspace { background:#34383b; min-width:0; }
.frame-bar { display:flex; align-items:center; justify-content:space-between; padding:6px 11px; gap:7px; background:#272b2e; color:#d8dcde; border-bottom:1px solid #44484b; }
.frame-bar .selector button { color:#d7dbdd; }
.frame-bar .selector button:hover { background:#42484b; }
.frame-bar .selector button[aria-pressed=true] { color:white; background:#42484b; border-color:#6d7578; }
.frame-bar .mono { overflow-wrap:anywhere; }
.frame-workspace .photo { max-width:820px; margin:auto; }
.frame-caption { display:flex; justify-content:space-between; gap:6px; padding:7px 11px; color:#d6dcdf; font-size:11px; border-top:1px solid #44484b; }
.results { border-left:1px solid var(--line); }
.results .details { padding:12px; border-top:1px solid var(--line); background:#fafafa; }
.results .details h2 { margin:5px 0; }
.results .details .button { margin-top:6px; }
.note { color:var(--muted); font-size:10px; }
.metric-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-bottom:1px solid var(--line); background:#f5f6f6; }
.metric-strip > div { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 9px; padding:10px 14px; }
.metric-strip > div + div { border-left:1px solid var(--line); }
.metric-strip strong { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
.metric-strip span { font-size:11px; color:var(--muted); }
.metric-strip .alarm { color:#9d3928; }
.ledger { padding:0 15px; }
.ledger .section-head { padding:12px 0 8px; }
.table-view { max-width:100%; overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; white-space:nowrap; }
th,td { border-bottom:1px solid var(--line); padding:7px 9px; text-align:left; }
th { color:var(--muted); background:#f5f6f6; font-size:11px; font-weight:500; }
td:last-child,th:last-child { text-align:right; }
td .filename { font-weight:500; }
.file-label { display:inline-flex; align-items:center; gap:7px; }
.file-label img { width:38px; height:25px; object-fit:cover; }
.status { color:#386354; display:inline-flex; gap:5px; align-items:center; }
.status::before { content:""; width:6px; height:6px; background:#517c6f; border-radius:50%; }
.history-footer { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); background:#fafafa; border-top:1px solid var(--line); margin:14px 0 0; }
.history-footer section { padding:10px 15px 13px; min-width:0; }
.history-footer section + section { border-left:1px solid var(--line); }
.daily { display:grid; grid-template-columns:repeat(7,1fr); margin-top:7px; gap:6px; }
.daily div { min-width:0; padding:3px 0; border-top:1px solid #ccd2d3; }
.daily div:last-child { border-top-color:#a33b29; }
.daily span,.daily strong { display:block; font-size:11px; }
.daily strong { color:var(--ink); margin-top:2px; font-size:13px; font-weight:550; }
.type-counts { margin-top:6px; columns:2; }
.type-counts p { font-size:11px; color:var(--muted); margin-bottom:3px; break-inside:avoid; }
.type-counts b { margin-left:3px; color:var(--ink); font-weight:550; }
.notice { color:var(--muted-foreground,#5b636a); font-size:10px; margin:6px 0 0; }
dialog { --ink:#262b30; --paper:#fff; color:var(--ink); background:var(--paper); width:min(420px,calc(100% - 24px)); border:1px solid #c8ced0; padding:13px; }
dialog::backdrop { background:#222a2d80; }
dialog .section-head { padding:0 0 8px; margin-bottom:8px; }
dialog .action-group { margin-top:9px; }
dialog input { width:100%; }
dialog img { margin-top:8px; max-height:180px; object-fit:contain; }
dialog p { margin-top:6px; }
@media (min-width:1120px) {
  .dispatch .split { grid-template-columns:minmax(255px,25%) minmax(0,1fr); }
  .map { min-height:540px; }
}
@media (max-width:785px) {
  .cover { gap:0 10px; flex-wrap:wrap; padding:0 10px; }
  .brand,.top-action { min-height:38px; }
  .options { flex:0 0 100%; order:3; min-height:36px; }
  .options button { padding:0 9px; }
  .dispatch .split { grid-template-columns:minmax(165px,32%) minmax(0,1fr); }
  .map { --map-h:300px; min-height:auto; padding-top:var(--map-h); }
  .map-image { height:var(--map-h); }
  .map-credit { bottom:auto; top:calc(var(--map-h) - 20px); }
  .marker,.map-tooltip { top:calc(var(--map-h) * var(--yp)); }
  .map-drawer { position:relative; right:auto; bottom:auto; width:100%; box-shadow:none; border:0; border-top:1px solid var(--line); }
  .map-drawer .content { display:grid; grid-template-columns:minmax(90px,1fr) 1.15fr; gap:3px 8px; }
  .map-drawer .photo { grid-column:1; grid-row:1/span 2; margin:0; }
  .map-drawer .content > :not(.photo) { grid-column:2; }
  .viewer .split { grid-template-columns:minmax(0,1fr) minmax(162px,29%); }
  .frame-bar { flex-wrap:wrap; }
  .ledger { padding:0 10px; }
  .metric-strip > div { padding:7px 9px; }
}
@media (max-width:560px) {
  .layout { padding:5px; }
  .brand { gap:7px; }
  .brand span { font-size:10px; }
  .options button { padding-inline:7px; font-size:11px; }
  .chrome { padding:9px; align-items:flex-start; }
  .chrome h1 { font-size:18px; }
  .chrome .action-group { flex-wrap:wrap; justify-content:end; }
  .dispatch .split,.viewer .split { display:block; }
  .dispatch .split { display:flex; flex-direction:column; }
  .map { order:-1; --map-h:min(64vw,245px); border-bottom:1px solid var(--line); }
  .map-tooltip { display:none; }
  .map-drawer { position:relative; right:auto; bottom:auto; width:100%; box-shadow:none; border:0; border-top:1px solid var(--line); }
  .map-drawer .content { display:grid; grid-template-columns:1fr 1.2fr; gap:3px 8px; }
  .map-drawer .photo { grid-column:1; grid-row:1/span 2; margin:0; }
  .map-drawer .content > :not(.photo) { grid-column:2; }
  .map-drawer .drawer-control { flex-wrap:wrap; }
  .queue,.results { border:0; }
  .results { border-top:1px solid var(--line); }
  .metric-strip { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .metric-strip > div:nth-child(3) { border-left:0; }
  .metric-strip > div:nth-child(n+3) { border-top:1px solid var(--line); }
  .history-footer { grid-template-columns:1fr; }
  .history-footer section + section { border-left:0; border-top:1px solid var(--line); }
}
</style>
</head>
<body>
<div class="layout">
  <div class="workspace">
    <header class="cover">
      <div class="brand"><b>МГТС</b><span>Осмотр сети</span></div>
      <nav class="options" aria-label="Разделы">
        <button type="button" data-view="dispatch" aria-pressed="true">Карта объектов</button>
        <button type="button" data-view="viewer" aria-pressed="false">Проверка кадра</button>
        <button type="button" data-view="overview" aria-pressed="false">Журнал обработок</button>
      </nav>
      <div class="top-action action-group"><button type="button" class="button" data-upload>Загрузить фото</button></div>
    </header>
    <main id="app"></main>
  </div>
  <p class="notice">Демонстрационные кадры и результаты</p>
</div>
<dialog id="upload" aria-labelledby="upload-title">
  <div class="section-head"><h2 id="upload-title">Новый анализ</h2><form method="dialog"><button type="submit" class="button mini" aria-label="Закрыть">×</button></form></div>
  <label for="photo-file" class="muted">Дорожный снимок</label>
  <input id="photo-file" type="file" accept="image/*">
  <img id="upload-preview" alt="Предпросмотр выбранного снимка" hidden>
  <p id="upload-note" role="status">В макете доступен предпросмотр файла. Для результатов открой пример анализа.</p>
  <div class="action-group"><button type="button" class="button primary" data-example>Открыть пример анализа</button></div>
</dialog>

const frames = records.filter((record,index) => records.findIndex(item => item.file === record.file) === index);

const app = document.getElementById('app');

let localPreview;

document.getElementById('photo-file').addEventListener('change', event => {
  if (localPreview) URL.revokeObjectURL(localPreview);
  const file = event.target.files[0];
  preview.hidden = !file;
  if (!file) { preview.removeAttribute('src'); return; }
  localPreview = URL.createObjectURL(file);
  preview.src = localPreview;
  note.textContent = 'Выбран файл ' + file.name + '. Для просмотра разметки открой пример анализа.';
});

function chrome(title, detail, actions) {
  return `<header class="chrome"><div><h1 tabindex="-1">${title}</h1><p class="muted">${detail}</p></div><div class="action-group">${actions}</div></header>`;
}
function photo(record, object, overlay, label) {
  const [x,y,w,h] = object.bounds;
  const frameClass = y < 8 ? 'bbox top-edge' : 'bbox';
  const textClass = x > 68 ? 'box-label align-right' : 'box-label';
  const accent = object.severity === 'normal' ? '#c3dbca' : '#f0ba70';
  return `<figure class="photo"><img src="${assets[record.image]}" alt="Демонстрационный дорожный кадр"><div class="${frameClass}" ${overlay ? '' : 'hidden'} style="--box:${accent};--box-x:${x}%;--box-y:${y}%;--box-w:${w}%;--box-h:${h}%">${label ? `<span class="${textClass}">${object.title} · ${object.confidence}</span>` : ''}</div></figure>`;
}
function severity(record) {
  return `<span class="severity ${record.severity}">${record.status}</span>`;
}
function map(items, current, drawer) {
  const position = record => `--x:${record.x}%;--y:${record.y}%;--yp:${record.y/100}`;
  const markers = items.map(({record,index}) => `<button class="marker ${record.severity}" type="button" aria-pressed="${index === state.selected}" aria-label="${record.title}, ${record.location}" data-record="${index}" style="${position(record)}">${index+1}</button>`).join('');
  return `<div class="map" aria-label="Карта объектов в Москве"><img class="map-image" src="${assets.map}" alt=""><span class="map-label">Москва, ЦАО</span>${markers}<span class="map-tooltip" style="${position(current)}">${current.id}</span><span class="map-credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a></span>${drawer}</div>`;
}
function dispatch() {
  const items = records.map((record,index) => ({record,index})).filter(({record}) => state.filter === 'all' || record.severity === state.filter);
  const current = items.find(({index}) => index === state.selected)?.record || items[0].record;
  const filters = [['all','Все'],['critical','Срочные'],['review','На проверку']].map(([key,label]) => `<button type="button" data-filter="${key}" aria-pressed="${state.filter === key}">${label}</button>`).join('');
  const rows = items.map(({record,index}) => `<button type="button" class="queue-row" data-record="${index}" aria-pressed="${index === state.selected}"><span><span class="row-name">${record.title}</span><span class="row-meta">${record.finding}</span><span class="row-meta">${record.location.split(',')[0]}</span></span><span class="row-code mono">${record.id}</span></button>`).join('');
  const drawer = `<aside class="map-drawer details"><div class="section-head"><div><h2>${current.title}</h2><span class="muted">${current.location.split(',')[0]}</span></div><span class="muted mono">${current.id}</span></div><div class="content">${photo(current,current,true,false)}<div><span class="row-name">${current.finding}</span><span class="row-meta">24 ноября, ${current.time}</span></div><div class="drawer-control">${severity(current)}<button type="button" class="button text" data-open="${records.indexOf(current)}">Кадр ↗</button></div></div></aside>`;
  return `<section class="dispatch">${chrome('Карта объектов','24 ноября 2026 · Центральный округ','<button type="button" class="button" data-export>Реестр CSV</button>')}<div class="split"><aside class="queue"><div class="section-head"><h2>Объекты</h2><span class="muted">${items.length} из ${records.length}</span></div><div class="selector">${filters}</div>${rows}</aside>${map(items,current,drawer)}</div></section>`;
}
function viewer() {
  const record = records[state.selected];
  const findings = findingsFor(record);
  const object = findings[state.finding] || findings[0];
  const next = '<button type="button" class="button" data-next>Следующий кадр →</button>';
  const rows = findings.map((item,index) => `<button type="button" class="detection-row" data-finding="${index}" aria-pressed="${index === state.finding}"><span><span class="row-name">${item.title}</span><span class="row-meta">${item.finding}</span></span><span class="row-code mono">${item.confidence}</span></button>`).join('');
  return `<section class="viewer">${chrome('Проверка кадра',record.location+' · 24 ноября, '+record.time,next)}<div class="split"><div class="frame-workspace"><div class="frame-bar"><span class="mono">${record.file}</span><div class="selector"><button type="button" data-overlay="false" aria-pressed="${!state.overlay}">Исходник</button><button type="button" data-overlay="true" aria-pressed="${state.overlay}">Разметка</button></div></div>${photo(record,object,state.overlay,true)}<div class="frame-caption"><span>Кадр ${frames.findIndex(frame => frame.file === record.file)+1} из ${frames.length}</span><span>Объектов в кадре: ${findings.length}</span></div></div><aside class="results"><div class="section-head"><h2>Объекты в кадре</h2><span class="mono muted">${findings.length}</span></div>${rows}<section class="details">${severity(object)}<h2>${object.title}</h2><dl><div><dt>Признак</dt><dd>${object.finding}</dd></div><div><dt>Уверенность модели</dt><dd class="mono">${object.confidence}</dd></div><div><dt>Место съёмки</dt><dd>${record.location.split(',')[0]}</dd></div></dl><button type="button" class="button text" data-onmap>Показать на карте ↗</button></section></aside></div></section>`;
}
function overview() {
  const daily = [12,16,19,15,23,18,25].map((value,index) => `<div><span class="muted">${18+index} ноя</span><strong>${value}</strong></div>`).join('');
  const rows = frames.map(record => `<tr><td class="mono">24.11.2026 ${record.time}</td><td><span class="file-label"><img src="${assets[record.image]}" alt="" loading="lazy"><span class="filename">${record.file}</span></span></td><td>${record.location.split(',')[0]}</td><td class="mono">${findingsFor(record).length}</td><td><span class="status">Обработано</span></td><td><button type="button" class="button text" data-open="${records.indexOf(record)}" aria-label="Открыть ${record.file}">Кадр ↗</button></td></tr>`).join('');
  return `<section class="overview">${chrome('Журнал обработок','18–24 ноября 2026 · Москва','<button type="button" class="button" data-export>Реестр CSV</button>')}<div class="metric-strip"><div><strong>128</strong><span>снимков обработано</span></div><div><strong>214</strong><span>объектов найдено</span></div><div><strong>38</strong><span>объектов на проверку</span></div><div><strong class="alarm">7</strong><span>срочных</span></div></div><section class="ledger"><div class="section-head"><h2>Последние снимки</h2><span class="muted">24 ноября</span></div><div class="table-view"><table><thead><tr><th>Время съёмки</th><th>Файл</th><th>Район</th><th>Объекты</th><th>Статус</th><th>Исходный кадр</th></tr></thead><tbody>${rows}</tbody></table></div></section><div class="history-footer"><section><h2>Обработано снимков по дням</h2><div class="daily">${daily}</div></section><section><h2>На проверку по типам</h2><div class="type-counts"><p>Кабельные колодцы <b>19</b></p><p>Опоры <b>14</b></p><p>Шкафы связи <b>5</b></p></div></section></div></section>`;
}
const views = {dispatch,viewer,overview};
function render(focusSelector) {
  document.querySelectorAll('.options button').forEach(button => button.setAttribute('aria-pressed', button.dataset.view === state.view));
  app.innerHTML = views[state.view]();
  if (focusSelector) app.querySelector(focusSelector)?.focus({preventScroll:true});
}
function selectRecord(index) {
  state.selected = index;
  const record = records[index];
  state.finding = findingsFor(record).indexOf(record);
  state.overlay = true;
}
function exportCsv() {
  const header = ['Объект','Тип','Признак','Район','Статус','Уверенность'];
  const rows = records.map(({id,title,finding,location,status,confidence}) => [id,title,finding,location,status,confidence]);
  const content = '\uFEFF' + [header,...rows].map(row => row.map(value => '"'+value.replaceAll('"','""')+'"').join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = 'mgts-demo-registry.csv';
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const data = button.dataset;
  if ('upload' in data) { upload.showModal(); return; }
  if ('example' in data) {
    upload.close();
    selectRecord(0);
    state.view = 'viewer';
    render();
    return;
  }
  if ('export' in data) { exportCsv(); return; }
  if (data.view) { state.view = data.view; render(button.closest('.options') ? null : 'h1'); return; }
  if (data.filter) {
    state.filter = data.filter;
    const index = records.findIndex(record => record.severity === state.filter);
    if (state.filter !== 'all' && records[state.selected].severity !== state.filter && index >= 0) selectRecord(index);
    render(`[data-filter="${data.filter}"]`);
    return;
  }
  if ('record' in data) {
    selectRecord(Number(data.record));
    const buttonClass = button.classList.contains('marker') ? '.marker' : '.queue-row';
    render(`${buttonClass}[data-record="${data.record}"]`);
    return;
  }
  if ('open' in data) {
    selectRecord(Number(data.open));
    state.view = 'viewer';
    render();
    return;
  }
  if ('finding' in data) {
    state.finding = Number(data.finding);
    state.overlay = true;
    render(`[data-finding="${data.finding}"]`);
    return;
  }
  if ('overlay' in data) {
    state.overlay = data.overlay === 'true';
    render(`[data-overlay="${data.overlay}"]`);
    return;
  }
  if ('next' in data) {
    const position = frames.findIndex(frame => frame.file === records[state.selected].file);
    selectRecord(records.indexOf(frames[(position + 1) % frames.length]));
    render('[data-next]');
    return;
  }
  if ('onmap' in data) {
    const record = findingsFor(records[state.selected])[state.finding];
    selectRecord(records.indexOf(record));
    state.view = 'dispatch';
    state.filter = 'all';
    render(`.marker[data-record="${state.selected}"]`);
  }
});
render();
</script>
</body>
</html>
