name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:58c180146f495109b851e82278c9cf43d1055b622287a4b6a464087f0c0dbf43
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check scanner detects synthetic test secret
        shell: bash
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          # Deliberately fake token, constructed only in runner temp storage.
          printf 'token=%s%s\n' 'ghp_' 'a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8' > "$fixture/test.txt"
          status=0
          docker run --rm --network none -v "$fixture:/scan:ro" "$GITLEAKS_IMAGE" dir /scan --redact=100 --exit-code=23 --no-banner || status=$?
          if [ "$status" -ne 23 ]; then
            echo '::error::Gitleaks self-test failed; scanner did not return the expected detection code.'
            exit 1
          fi
      - name: Scan committed snapshot
        shell: bash
        run: |
          snapshot=$(mktemp -d)
          trap 'rm -rf "$snapshot"' EXIT
          git archive HEAD | tar -x -C "$snapshot"
          docker run --rm --network none -v "$snapshot:/scan:ro" "$GITLEAKS_IMAGE" dir /scan --redact=100 --no-banner
      - name: Scan Git history
        shell: bash
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/scan \
            -v "$GITHUB_WORKSPACE:/scan:ro" "$GITLEAKS_IMAGE" git /scan --log-opts='--all' --redact=100 --no-banner

  python-audit:
    name: Python code and dependency audit (report)
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install standalone security tools
        run: python -m pip install -r requirements-security.txt
      - name: Ruff lint report
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports"
          ruff check app tests migrations --exit-zero --output-format concise | tee "$RUNNER_TEMP/security-reports/ruff.txt"
      - name: Bandit static analysis
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports"
          bandit -r app -f json -o "$RUNNER_TEMP/security-reports/bandit.json" --exit-zero
      - name: Audit resolved Backend dependencies
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports"
          report="$RUNNER_TEMP/security-reports/pip-audit.json"
          status=0
          pip-audit -r requirements.txt --format json --output "$report" --progress-spinner off || status=$?
          python scripts/check_pip_audit.py "$report" "$status"
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-python
          path: ${{ runner.temp }}/security-reports/
          retention-days: 7
          if-no-files-found: warn

  container-audit:
    name: Backend image scan and SBOM (report)
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Backend image and export archive
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports" "$RUNNER_TEMP/trivy-cache"
          docker build --pull --tag mgts-backend:security .
          docker save --output "$RUNNER_TEMP/backend-image.tar" mgts-backend:security
      - name: Scan OS and Python packages
        shell: bash
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/backend-image.tar:/scan/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --format json \
            > "$RUNNER_TEMP/security-reports/trivy.json"
      - name: Generate CycloneDX SBOM
        if: (success() || failure()) && steps.build.outcome == 'success'
        shell: bash
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/backend-image.tar:/scan/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --input /scan/image.tar --format cyclonedx \
            > "$RUNNER_TEMP/security-reports/backend.cdx.json"
      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-container
          path: ${{ runner.temp }}/security-reports/
          retention-days: 7
          if-no-files-found: warn
