# Optional overlay; no changes to application services.
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend-net, monitoring-net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  grafana:
    image: grafana/grafana:13.3.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${MGTS_GRAFANA_PASSWORD:?Set MGTS_GRAFANA_PASSWORD locally}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/mgts-dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [monitoring-net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  prometheus-data:
  grafana-data:
networks:
  monitoring-net:
