services:
  backend:
    build: .
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
      TRITON_URL: ${TRITON_URL:-http://triton:8000}
      INFERENCE_MODE: ${INFERENCE_MODE:-disabled}
      TRITON_MODEL_NAME: ${TRITON_MODEL_NAME:-detection}
      TRITON_MODEL_VERSION: ${TRITON_MODEL_VERSION:-1}
      TRITON_TIMEOUT_SECONDS: ${TRITON_TIMEOUT_SECONDS:-30}
      UPLOAD_DIR: /app/uploads
      BACKEND_BIND: ${BACKEND_BIND:-127.0.0.1}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      DGIS_BROWSER_KEY: ${DGIS_BROWSER_KEY:-}
      DGIS_API_KEY: ${DGIS_API_KEY:-}
      DGIS_BASE_URL: ${DGIS_BASE_URL:-https://catalog.api.2gis.com}
      DGIS_LOCALE: ${DGIS_LOCALE:-ru_RU}
      DGIS_TIMEOUT_SECONDS: ${DGIS_TIMEOUT_SECONDS:-30}
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

networks:
  backend-net:

volumes:
  postgres-data:
  uploads:
